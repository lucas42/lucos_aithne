version: 2.1
orbs:
  lucos: lucos/deploy@0

jobs:
  fetch-scopes:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Fetch canonical scopes.yaml from lucos_auth_scopes image
          command: ./scripts/fetch-scopes.sh
      - persist_to_workspace:
          root: .
          paths:
            - scopes.yaml

  test:
    docker:
      - image: golang:1.26
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run tests
          command: go test ./...

workflows:
  version: 2
  build-deploy:
    jobs:
      - fetch-scopes
      - test:
          requires:
            - fetch-scopes
      - lucos/build:
          platform: "linux/amd64"
      - lucos/deploy-avalon:
          serial-group: deploy-avalon
          requires:
            - test
            - lucos/build
          filters:
            branches:
              only:
                - main
