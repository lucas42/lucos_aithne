services:
  lucos_aithne:
    build: .
    container_name: lucos_aithne
    image: lucas42/lucos_aithne:${VERSION:-latest}
    restart: always
    ports:
      - $PORT:$PORT
    # Resolve host.docker.internal to the host gateway so the container can reach
    # other services published on the host (e.g. lucos_contacts on port 8013) by a
    # stable, Docker-managed name rather than a hardcoded bridge IP. On Docker Desktop
    # this name is built in; on Linux Docker Engine it must be mapped explicitly.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT
      - SYSTEM
      - ENVIRONMENT
      - APP_ORIGIN
      - DB_PATH=/data/aithne.db
      - LUCOS_CONTACTS_ORIGIN
      - KEY_LUCOS_CONTACTS
      - SIGNING_KEK
      - BOOTSTRAP_ADMIN_CONTACT_ID
      - CLIENT_KEYS
    volumes:
      - credential_store:/data
    healthcheck:
      test: ["CMD", "/lucos_aithne", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  credential_store:
