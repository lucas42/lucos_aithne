<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — lucOS</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/aithne.css">
</head>
<body>
  <lucos-navbar>lucOS</lucos-navbar>
  <div class="card">
    <p class="subtitle">Sign in with your passkey</p>
    <form id="loginForm" novalidate>
      <button type="submit" id="submitBtn">Sign in with passkey</button>
    </form>
    <div class="error" id="errorBox" role="alert" tabindex="-1" hidden></div>
  </div>

  <script src="/aithne.js" type="text/javascript" nonce="{{.Nonce}}"></script>
  <script nonce="{{.Nonce}}">
    // ── Options / assertion helpers ────────────────────────────────────────────

    // Convert server's base64url challenge and allowCredentials ids to ArrayBuffers.
    function decodeCredentialRequestOptions(opts) {
      if (opts.publicKey.challenge) {
        opts.publicKey.challenge = b64urlToBytes(opts.publicKey.challenge);
      }
      if (opts.publicKey.allowCredentials) {
        opts.publicKey.allowCredentials = opts.publicKey.allowCredentials.map(c => ({
          ...c,
          id: b64urlToBytes(c.id),
        }));
      }
      return opts.publicKey;
    }

    // Encode a PublicKeyCredential assertion for the server.
    function encodeAssertion(cred) {
      const resp = cred.response;
      return {
        id: cred.id,
        rawId: bytesToB64url(cred.rawId),
        type: cred.type,
        response: {
          authenticatorData: bytesToB64url(resp.authenticatorData),
          clientDataJSON:    bytesToB64url(resp.clientDataJSON),
          signature:         bytesToB64url(resp.signature),
          userHandle:        resp.userHandle ? bytesToB64url(resp.userHandle) : null,
        },
      };
    }

    // ── UI helpers ─────────────────────────────────────────────────────────────

    const errorBox = document.getElementById('errorBox');
    const btn      = document.getElementById('submitBtn');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.hidden = false;
      errorBox.focus(); // moves focus to the error so keyboard / screen-reader users are notified
    }

    function clearError() {
      errorBox.hidden = true;
      errorBox.textContent = '';
    }

    function setPending(yes) {
      // aria-disabled keeps the button in the tab order (unlike `disabled`).
      btn.setAttribute('aria-disabled', yes ? 'true' : 'false');
      btn.textContent = yes ? 'Waiting for passkey…' : 'Sign in with passkey';
    }

    // Redirect to ?next= only if it is a same-origin path.
    function safeRedirect() {
      const next = new URLSearchParams(window.location.search).get('next');
      if (next) {
        try {
          const url = new URL(next, window.location.origin);
          if (url.origin === window.location.origin) {
            window.location.href = url.href;
            return;
          }
        } catch (_) {}
      }
      window.location.href = '/';
    }

    // ── Discoverable login (button-triggered) ────────────────────────────────
    //
    // When the user clicks "Sign in with passkey" the browser presents a picker
    // of all passkeys registered for l42.eu. The server identifies the principal
    // from the assertion's userHandle (set at registration time as the internal
    // principal ID).

    async function authenticateDiscoverable() {
      clearError();
      setPending(true);

      try {
        const beginResp = await fetch('/auth/login/begin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contact_id: '' }),
        });
        if (!beginResp.ok) {
          showError('Could not start sign-in. Try again, or come back later.');
          return;
        }

        const data = await beginResp.json();
        const sessionId = data.aithne_session;
        const publicKey = decodeCredentialRequestOptions(data);

        let assertion;
        try {
          assertion = await navigator.credentials.get({ publicKey });
        } catch (err) {
          if (err.name === 'NotAllowedError') {
            showError('Sign-in cancelled. Try again when you\'re ready.');
          } else {
            showError('Couldn\'t get passkey. Try a different device, or try again.');
          }
          return;
        }

        const url = '/auth/login/finish' + (sessionId ? '?session=' + encodeURIComponent(sessionId) : '');
        const finishResp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(encodeAssertion(assertion)),
        });
        if (!finishResp.ok) {
          if (finishResp.status === 403) {
            showError('Sign-in refused for security reasons. Contact the administrator if this is unexpected.');
          } else {
            showError('Passkey verification failed. Try a different device, or try again.');
          }
          return;
        }

        safeRedirect();
      } catch (_) {
        showError('Something went wrong. Try again, or come back later.');
      } finally {
        setPending(false);
      }
    }

    // ── Conditional mediation (passkey autofill) ───────────────────────────────
    //
    // Modern browsers (Chrome 108+, Safari 16+, Firefox 119+) can offer passkey
    // sign-in via an autofill prompt before the user clicks the button.
    // The conditional request must be started before the user interacts.
    // Uses the same discoverable login backend path as authenticateDiscoverable()
    // above (empty contact_id → session token → finish by userHandle).

    let conditionalAbort = null;

    async function startConditional() {
      if (
        !window.PublicKeyCredential ||
        typeof PublicKeyCredential.isConditionalMediationAvailable !== 'function'
      ) return;
      const available = await PublicKeyCredential.isConditionalMediationAvailable().catch(() => false);
      if (!available) return;

      conditionalAbort = new AbortController();
      try {
        const beginResp = await fetch('/auth/login/begin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contact_id: '' }),
          signal: conditionalAbort.signal,
        });
        if (!beginResp.ok) return; // silently skip if server rejects empty contact_id

        const data = await beginResp.json();
        const sessionId = data.aithne_session; // server-issued token to correlate begin/finish
        const publicKey = decodeCredentialRequestOptions(data);
        const assertion = await navigator.credentials.get({
          publicKey,
          mediation: 'conditional',
          signal: conditionalAbort.signal,
        });

        // Pass the session token so the server can match the begin session and
        // identify the principal from the assertion's userHandle.
        const url = '/auth/login/finish' + (sessionId ? '?session=' + encodeURIComponent(sessionId) : '');
        const finishResp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(encodeAssertion(assertion)),
        });
        if (finishResp.ok) safeRedirect();
        else showError('Sign-in failed. Try clicking the sign-in button instead.');
      } catch (err) {
        if (err.name !== 'AbortError') {
          // Conditional failures are silent — user can still use the button path.
        }
      }
    }

    // ── Event binding ──────────────────────────────────────────────────────────

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (conditionalAbort) { conditionalAbort.abort(); conditionalAbort = null; }
      await authenticateDiscoverable();
    });

    startConditional();
  </script>
  <script src="/lucos_navbar.js" type="text/javascript" nonce="{{.Nonce}}"></script>
</body>
</html>
