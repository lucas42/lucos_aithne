<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .IsRecovery}}Create a new passkey{{else}}Set up your passkey{{end}} — lucOS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1a1a;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,.1);
      padding: 2rem;
      width: 100%;
      max-width: 360px;
    }
    h1 { font-size: 1.4rem; margin-bottom: .25rem; }
    .subtitle { color: #666; font-size: .875rem; margin-bottom: 1.5rem; }
    label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: .375rem; }
    input[type="text"] {
      display: block;
      width: 100%;
      padding: .5rem .75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 1rem;
    }
    input[type="text"]:focus { border-color: #0066cc; }
    button {
      display: block;
      width: 100%;
      padding: .625rem;
      font-size: 1rem;
      font-weight: 600;
      background: #0066cc;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #0052a3; }
    button[aria-disabled="true"] { background: #aaa; cursor: default; pointer-events: none; }
    .error {
      background: #fff0f0;
      border: 1px solid #f5c6cb;
      border-radius: 6px;
      padding: .625rem .75rem;
      font-size: .875rem;
      color: #c00;
      margin-top: .75rem;
    }
    .error[hidden] { display: none; }
    .hint {
      font-size: .8rem;
      color: #777;
      margin-top: -.75rem;
      margin-bottom: 1rem;
    }
    .success {
      text-align: center;
      margin-top: .5rem;
    }
    .success p { color: #555; font-size: .875rem; margin-bottom: 1rem; }
    .success a {
      display: inline-block;
      padding: .625rem 1.5rem;
      background: #0066cc;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: .9rem;
    }
    .success a:hover { background: #0052a3; }
  </style>
</head>
<body>
  <div class="card">
    <h1>lucOS</h1>
    {{if .IsRecovery}}
    <p class="subtitle">Create a new passkey for <strong>{{.DisplayName}}</strong>.</p>
    {{else}}
    <p class="subtitle">Set up access for <strong>{{.DisplayName}}</strong>.</p>
    {{end}}

    <form id="enrolForm" novalidate>
      <label for="label">Passkey name</label>
      <input type="text" id="label" name="label"
             placeholder="e.g. MacBook Touch ID" autocomplete="off"
             aria-describedby="labelHint">
      <p class="hint" id="labelHint">Give this passkey a name so you can identify it later.</p>
      {{if .IsRecovery}}
      <button type="submit" id="submitBtn">Create new passkey</button>
      {{else}}
      <button type="submit" id="submitBtn">Set up passkey</button>
      {{end}}
    </form>
    <div class="error" id="errorBox" role="alert" tabindex="-1" hidden></div>
    <div class="success" id="successBox" hidden>
      <p>Your passkey is set up.</p>
      <a href="/auth/login">Sign in →</a>
    </div>
  </div>

  <script>
    // Invite token embedded by the server — never read from client URL params.
    const inviteToken = {{.Token | js}};

    function b64urlToBytes(b64url) {
      let b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    function bytesToB64url(buffer) {
      const bytes = new Uint8Array(buffer);
      let bin = '';
      for (const b of bytes) bin += String.fromCharCode(b);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }

    function decodeCredentialCreationOptions(opts) {
      const pk = opts.publicKey;
      if (pk.challenge) pk.challenge = b64urlToBytes(pk.challenge);
      if (pk.user && pk.user.id) pk.user.id = b64urlToBytes(pk.user.id);
      if (pk.excludeCredentials) {
        pk.excludeCredentials = pk.excludeCredentials.map(c => ({
          ...c,
          id: b64urlToBytes(c.id),
        }));
      }
      return pk;
    }

    function encodeAttestation(cred) {
      const resp = cred.response;
      return {
        id: cred.id,
        rawId: bytesToB64url(cred.rawId),
        type: cred.type,
        response: {
          attestationObject: bytesToB64url(resp.attestationObject),
          clientDataJSON:    bytesToB64url(resp.clientDataJSON),
        },
        transports: resp.getTransports ? resp.getTransports() : [],
      };
    }

    const errorBox   = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    const form       = document.getElementById('enrolForm');
    const btn        = document.getElementById('submitBtn');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.hidden = false;
      errorBox.focus();
    }

    function clearError() {
      errorBox.hidden = true;
      errorBox.textContent = '';
    }

    function setPending(yes) {
      btn.setAttribute('aria-disabled', yes ? 'true' : 'false');
      btn.textContent = yes ? 'Creating passkey…' : btn.dataset.label;
    }

    btn.dataset.label = btn.textContent;

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      clearError();
      const label = document.getElementById('label').value.trim();
      setPending(true);

      try {
        // Step 1: get registration options (validates invite, does not consume).
        const beginResp = await fetch('/enrol/begin?token=' + encodeURIComponent(inviteToken), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}',
        });
        if (!beginResp.ok) {
          if (beginResp.status === 401) {
            showError('This invite link is no longer valid. Please ask the administrator to send a new one.');
          } else {
            showError('Could not start registration. Try again, or contact the administrator.');
          }
          return;
        }
        const publicKey = decodeCredentialCreationOptions(await beginResp.json());

        // Step 2: invoke the browser passkey prompt.
        let attestation;
        try {
          attestation = await navigator.credentials.create({ publicKey });
        } catch (err) {
          if (err.name === 'NotAllowedError') {
            showError('Passkey not created — cancelled. Try again when you\'re ready.');
          } else if (err.name === 'InvalidStateError') {
            showError('A passkey for this account already exists on this device.');
          } else {
            showError('Couldn\'t create passkey. Try a different device, or try again.');
          }
          return;
        }

        // Step 3: finish registration (atomic wipe + register + consume invite).
        const params = new URLSearchParams({ token: inviteToken, label: label || 'passkey' });
        const finishResp = await fetch('/enrol/finish?' + params, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(encodeAttestation(attestation)),
        });
        if (!finishResp.ok) {
          showError('Registration failed. Try again, or contact the administrator.');
          return;
        }

        // Success — hide form, show confirmation with sign-in link.
        form.hidden = true;
        successBox.hidden = false;
      } catch (_) {
        showError('Something went wrong. Try again, or come back later.');
      } finally {
        setPending(false);
      }
    });
  </script>
</body>
</html>
