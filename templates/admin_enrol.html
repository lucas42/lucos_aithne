<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generate invite — lucOS Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/aithne.css">
  <style nonce="{{.Nonce}}">
    .card { max-width: 420px; }
    .admin-nav {
      display: flex; gap: 1rem;
      font-size: .8rem;
      margin-bottom: 1.25rem;
      padding-bottom: .875rem;
      border-bottom: 1px solid #f0f0f0;
    }
    .admin-nav a { color: #555; text-decoration: none; }
    .admin-nav a:hover { text-decoration: underline; }
    .result {
      margin-top: 1.25rem;
      padding: 1rem;
      background: #fef8e0;
      border: 1px solid #e8d060;
      border-radius: 6px;
    }
    .result[hidden] { display: none; }
    .result p { font-size: .8rem; color: #555; margin-bottom: .5rem; }
    .result-url {
      font-family: monospace;
      font-size: .8rem;
      word-break: break-all;
      color: #1a1a1a;
      background: #fdf3c0;
      padding: .5rem;
      border-radius: 4px;
      margin-bottom: .5rem;
    }
    .copy-btn {
      display: inline-block;
      width: auto;
      padding: .375rem .75rem;
      font-size: .8rem;
      background: #f5c300;
      color: #1a1a1a;
    }
    .copy-btn:hover { background: #d4a500; }
    .expires {
      font-size: .75rem;
      color: #777;
      margin-top: .375rem;
    }
    .revoke-btn {
      display: inline-block;
      width: auto;
      padding: .375rem .75rem;
      font-size: .8rem;
      background: #c0392b;
      color: #fff;
      margin-top: .5rem;
      margin-left: .5rem;
    }
    .revoke-btn:hover { background: #922b21; }
    .revoke-btn[aria-disabled="true"] { background: #aaa; cursor: default; pointer-events: none; }
    .revoked-notice {
      margin-top: .625rem;
      font-size: .8rem;
      color: #c0392b;
      font-weight: 500;
    }
    .revoked-notice[hidden] { display: none; }
  </style>
</head>
<body>
  <lucos-navbar>Generate invite</lucos-navbar>
  <div class="card">
    <nav class="admin-nav">
      <a href="/">← Home</a>
      <a href="/admin/grants">Manage grants</a>
    </nav>

    <form id="inviteForm" novalidate>
      <label for="contactSearch">Contact</label>
      <input type="text" id="contactSearch"
             placeholder="Type a name…" autocomplete="off"
             list="contactsList">
      <input type="hidden" id="contactId">
      <datalist id="contactsList"></datalist>
      <button type="submit" id="submitBtn">Generate invite link</button>
    </form>
    <div class="error" id="errorBox" role="alert" tabindex="-1" hidden></div>

    <div class="result" id="resultBox" hidden>
      <p id="recipientName" aria-live="polite"></p>
      <p>Send this link to the contact. It expires in 24 hours and can only be used once.</p>
      <output class="result-url" id="inviteUrl" aria-label="Invite URL" aria-live="polite"></output>
      <button class="copy-btn" id="copyBtn" type="button">Copy link</button>
      <button class="revoke-btn" id="revokeBtn" type="button">Revoke invite</button>
      <p class="expires" id="expiresText"></p>
      <p class="revoked-notice" id="revokedNotice" role="status" hidden>Invite revoked. The link is no longer usable.</p>
    </div>
  </div>

  <script nonce="{{.Nonce}}">
    // Session token injected by the server — the aithne_session cookie is
    // HttpOnly, so JavaScript cannot read it from document.cookie.
    const sessionToken = {{.SessionToken | js}};

    const form          = document.getElementById('inviteForm');
    const btn           = document.getElementById('submitBtn');
    const errorBox      = document.getElementById('errorBox');
    const resultBox     = document.getElementById('resultBox');
    const urlEl         = document.getElementById('inviteUrl');
    const copyBtn       = document.getElementById('copyBtn');
    const revokeBtn     = document.getElementById('revokeBtn');
    const revokedNotice = document.getElementById('revokedNotice');
    const expiresEl     = document.getElementById('expiresText');
    const searchInput   = document.getElementById('contactSearch');
    const contactIdEl   = document.getElementById('contactId');
    const datalist      = document.getElementById('contactsList');

    // Holds the token_hash of the currently displayed invite, for revocation.
    let currentTokenHash = null;

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.hidden = false;
      errorBox.focus();
    }

    function clearError() {
      errorBox.hidden = true;
      errorBox.textContent = '';
    }

    function setPending(yes) {
      btn.setAttribute('aria-disabled', yes ? 'true' : 'false');
      btn.textContent = yes ? 'Generating…' : 'Generate invite link';
    }

    // ── Contact name search ──────────────────────────────────────────────────
    let contactsData = [];

    // Fetch the contact list and populate the <datalist> for name-search.
    (async function loadContacts() {
      try {
        const resp = await fetch('/admin/contacts', {
          headers: { 'Authorization': 'Bearer ' + sessionToken },
        });
        if (!resp.ok) return;
        contactsData = await resp.json();
        contactsData.forEach(function(c) {
          const opt = document.createElement('option');
          opt.value = c.name;
          datalist.appendChild(opt);
        });
      } catch (_) {
        // Non-fatal — fall back to accepting a raw ID.
      }
    })();

    // Resolve the hidden contact ID whenever the visible input changes.
    searchInput.addEventListener('change', function() {
      const match = contactsData.find(function(c) { return c.name === searchInput.value; });
      contactIdEl.value = match ? match.id : '';
    });

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      clearError();
      resultBox.hidden = true;

      // Resolve contact ID: prefer the hidden field set by datalist selection;
      // fall back to treating the typed text as a raw ID (contacts unavailable).
      let contactId = contactIdEl.value.trim();
      if (!contactId) contactId = searchInput.value.trim();
      if (!contactId) { showError('Enter a contact name or ID.'); searchInput.focus(); return; }

      const token = sessionToken;
      setPending(true);
      try {
        const resp = await fetch('/admin/invites', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
          },
          body: JSON.stringify({ contact_id: contactId }),
        });

        if (!resp.ok) {
          const text = await resp.text();
          if (resp.status === 401 || resp.status === 403) {
            showError('Access denied. Make sure you are signed in with an admin account.');
          } else if (resp.status === 422) {
            showError('Contact not found in lucos_contacts. Check the name or ID and try again.');
          } else {
            showError('Could not generate invite: ' + text.trim());
          }
          return;
        }

        const data = await resp.json();
        const nameEl = document.getElementById('recipientName');
        if (data.display_name) {
          nameEl.textContent = 'Invite generated for ' + data.display_name + ' (' + contactId + ').';
        }
        urlEl.textContent = data.invite_url;
        expiresEl.textContent = 'Expires: ' + new Date(data.expires_at).toLocaleString();
        currentTokenHash = data.token_hash || null;
        revokeBtn.setAttribute('aria-disabled', 'false');
        revokeBtn.hidden = false;
        revokedNotice.hidden = true;
        resultBox.hidden = false;
      } catch (_) {
        showError('Something went wrong. Try again.');
      } finally {
        setPending(false);
      }
    });

    copyBtn.addEventListener('click', async function() {
      const url = urlEl.textContent;
      try {
        await navigator.clipboard.writeText(url);
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = 'Copy link'; }, 2000);
      } catch (_) {
        // Fallback: select text for manual copy.
        const range = document.createRange();
        range.selectNode(urlEl);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
      }
    });

    revokeBtn.addEventListener('click', async function() {
      if (!currentTokenHash) { return; }
      revokeBtn.setAttribute('aria-disabled', 'true');
      clearError();
      try {
        const resp = await fetch('/admin/invites/' + currentTokenHash, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + sessionToken },
        });
        if (!resp.ok) {
          const text = await resp.text();
          if (resp.status === 401 || resp.status === 403) {
            showError('Access denied. Make sure you are signed in with an admin account.');
          } else if (resp.status === 404) {
            showError('Invite not found. It may have already expired.');
          } else if (resp.status === 409) {
            showError('Invite has already been used or revoked.');
          } else {
            showError('Could not revoke invite: ' + text.trim());
          }
          revokeBtn.setAttribute('aria-disabled', 'false');
          return;
        }
        // Success — mark as revoked in the UI.
        urlEl.textContent = '';
        copyBtn.hidden = true;
        revokeBtn.hidden = true;
        expiresEl.textContent = '';
        revokedNotice.hidden = false;
        currentTokenHash = null;
      } catch (_) {
        showError('Something went wrong. Try again.');
        revokeBtn.setAttribute('aria-disabled', 'false');
      }
    });
  </script>
  <script src="/lucos_navbar.js" type="text/javascript" nonce="{{.Nonce}}"></script>
</body>
</html>
